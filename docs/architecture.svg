<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 830" width="1040" height="830" role="img" aria-labelledby="ttl dsc">
<title id="ttl">AI Job Search System architecture</title>
<desc id="dsc">Inputs on the left feed a four-stage pipeline: discovery, intelligence, tailoring, and document generation. Three amber human review steps sit between the stages. Data files and generated documents appear on the right. A shared AI layer of the Claude API, prompt rules, and output guardrails supports stages two through four.</desc>
