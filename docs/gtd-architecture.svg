<text x="30" y="786" fill="#7c848d" font-size="10.5" font-weight="700" letter-spacing="1.5">ALL OF THE ABOVE RUNS ON ONE LINUX BOX IN MY HOME OFFICE</text>
<rect x="30" y="800" width="326" height="54" rx="8" fill="#7a2318" stroke="#a3392a" stroke-width="1.5"/>
<text x="193.0" y="823.0" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">Ollama · llama3.1:8b</text>
<text x="193.0" y="840.0" text-anchor="middle" fill="#e3e3e3" font-size="11">four narrow calls, my hardware, no API</text>
<rect x="372" y="800" width="326" height="54" rx="8" fill="#4a4a4a" stroke="#6b6b6b" stroke-width="1.5"/>
<text x="535.0" y="823.0" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">Ubuntu · PM2 · cron</text>
<text x="535.0" y="840.0" text-anchor="middle" fill="#e3e3e3" font-size="11">restarts on reboot, no babysitting</text>
<rect x="714" y="800" width="326" height="54" rx="8" fill="#1a6b5a" stroke="#2a8b76" stroke-width="1.5"/>
<text x="877.0" y="823.0" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="600">No subscription</text>
<text x="877.0" y="840.0" text-anchor="middle" fill="#e3e3e3" font-size="11">and no calendar or mail leaves the network</text>
<text x="30" y="892" fill="#7c848d" font-size="11.5">The model never chooses the priority.  Python ranks the day from a fixed ladder, then the model is handed the winner and asked only to phrase it.</text>
<text x="30" y="912" fill="#7c848d" font-size="11.5">Every model call has a deterministic fallback, so a dead model degrades the brief instead of breaking it.</text>
</svg>
