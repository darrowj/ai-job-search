<text x="520.0" y="361.0" text-anchor="middle" fill="#e3e3e3" font-size="11">a fixed priority ladder in Python, no model involved</text>
<text x="520.0" y="376.0" text-anchor="middle" fill="#e3e3e3" font-size="11">HIGH task &gt; live job stage &gt; interview on the calendar</text>
<text x="520.0" y="391.0" text-anchor="middle" fill="#e3e3e3" font-size="11">&gt; overdue task &gt; urgent email &gt; first event of the day</text>
