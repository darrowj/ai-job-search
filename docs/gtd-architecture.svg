<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 940" width="1040" height="940" role="img" aria-labelledby="gttl gdsc">
<title id="gttl">AI Weekly Organizer daily brief architecture</title>
<desc id="gdsc">A weekday cron job runs one Python script that reads Google Calendar, Gmail, and three Notion databases. A narrow regex plus one batched local-model call filters the inbox. A fixed priority ladder written in Python then decides which single item matters most, with no model involved. Only after that is a locally hosted Llama 3.1 model asked to phrase the sentence, write prep notes, and draft a narrative paragraph, each with a deterministic fallback. The result is one JSON file the Next.js planner renders as a Daily Brief card. Everything runs on a self-hosted Linux server with no subscription and no data leaving the home network.</desc>
